status:
  scope: >
    Two theorems about Lehmer's degree-10 polynomial L: (i) L is irreducible over
    the integers; (ii) the characteristic polynomial of a Coxeter element of the
    E10 Weyl group (defined in the challenge file as the product of the ten simple
    reflections of the E10 generalized Cartan matrix, acting on the root lattice)
    equals L.  Supporting results proved along the way include Kronecker's 1857
    theorem in root form (a monic integer polynomial with all complex roots on the
    unit circle has only roots of unity as roots), the non-divisibility of L by
    any cyclotomic polynomial, the exact Mahler measure M(L) = mu (the Salem root)
    against Mathlib's Polynomial.mahlerMeasure API with bounds 1 < M(L) < 7/5, the
    infinite order of the E10 Coxeter element, and the exact order 30 (the Coxeter
    number) of the E8 Coxeter element in the same convention.  Lehmer's 1933
    conjecture (a positive lower bound for Mahler measures exceeding 1) is STATED
    in Mathlib's Mahler-measure vocabulary (LehmerConjecture / LehmerMinimal,
    hypothesis Props) but NOT claimed or assumed anywhere in this repository.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "main_theorem"
      file: "LehmerE10.lean"
